<!--
  The Route Map's template. scripts/route-map.ts fills window.DATA from docs/backlog.md and docs/playbook.md (and the
  head commit), and nothing else: every item below is a row of those files. Keep this file ASCII (characters outside
  it are written as \u escapes or entities), so the page reads the same however a browser guesses its encoding.
-->
<style>
/* Layout: a wayfinding board. Milestones are routes, backlog rows are stops; a stop's shape and colour say its state. */
:root {
  --bg: #f2f3f1;            /* road-atlas paper, a hair of green */
  --panel: #ffffff;
  --ink: #1d2321;           /* asphalt ink */
  --muted: #5d6662;
  --rule: #d6dad6;
  --accent: #7a4a26;        /* scenic-byway sign brown */
  --accent-ink: #ffffff;
  --ok: #2f7a4d;            /* can land now */
  --stop: #b23b2a;          /* waits on another row */
  --wait: #9a6a0c;          /* needs something not there today */
  --ask: #2c5aa0;           /* a small choice of the owner's */
  --done: #8a918d;
  --chip: #e7eae7;
  --focus: #2c5aa0;
  --display: "Overpass", "Highway Gothic", "Trebuchet MS", system-ui, sans-serif;
  --body: "Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Overpass Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --s-1: 0.8125rem; --s0: 0.9375rem; --s1: 1.0625rem; --s2: 1.3rem; --s3: 1.75rem; --s4: 2.4rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141716; --panel: #1c201e; --ink: #e7e9e6; --muted: #a2aaa5; --rule: #323835;
    --accent: #c98c5a; --accent-ink: #1a120c; --ok: #5fbf86; --stop: #ec7e6a; --wait: #e2b24e; --ask: #84aaf0; --done: #7c8480;
    --chip: #262b29; --focus: #84aaf0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141716; --panel: #1c201e; --ink: #e7e9e6; --muted: #a2aaa5; --rule: #323835;
  --accent: #c98c5a; --accent-ink: #1a120c; --ok: #5fbf86; --stop: #ec7e6a; --wait: #e2b24e; --ask: #84aaf0; --done: #7c8480;
  --chip: #262b29; --focus: #84aaf0; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: var(--s0); line-height: 1.5; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: var(--s4); font-weight: 800; line-height: 1.05; }
h2 { font-size: var(--s3); font-weight: 800; line-height: 1.1; }
h3 { font-size: var(--s1); font-weight: 700; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--chip); padding: 0 4px; border-radius: 3px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: var(--s-1); }
.muted { color: var(--muted); }
.label { font-family: var(--display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }

/* The two files: a junction sign, one panel per file. */
.panes { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 0 14px; }
.pane { flex: 1 1 240px; min-width: 0; display: grid; gap: 2px; text-align: left; border: 2px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 10px 14px 8px; cursor: pointer; }
.pane b { font-family: var(--display); font-weight: 800; font-size: var(--s2); line-height: 1.1; }
.pane span { color: var(--muted); font-size: var(--s-1); }
.pane:hover:not([aria-selected="true"]) { border-color: var(--ink); }
.pane[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pane[aria-selected="true"] span { color: var(--accent-ink); }

/* Header: a guide sign. */
.sign { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: end; padding-block: 8px 18px; border-bottom: 3px solid var(--ink); }
.sign .plate { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 10px 3px; border-radius: 4px; width: max-content; }
.sign .plate .shield { width: 14px; height: 16px; background: var(--accent-ink); clip-path: polygon(50% 0, 100% 18%, 92% 72%, 50% 100%, 8% 72%, 0 18%); }
.sign .lede { max-width: 68ch; color: var(--muted); font-size: var(--s1); }
.asof { font-family: var(--mono); font-size: var(--s-1); color: var(--muted); overflow-wrap: anywhere; }

/* Mile markers: the numbers, as sums that add up. */
.strips { display: grid; gap: 14px; margin-block: 18px 6px; }
.strip { display: grid; gap: 6px; min-width: 0; }
.eq { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.op { align-self: center; font-family: var(--display); font-weight: 800; font-size: var(--s2); color: var(--muted); flex: none; }
.marker { flex: 1 1 96px; min-width: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; text-align: left; cursor: pointer; align-content: start; }
.marker:hover { border-color: var(--ink); }
.marker.static { cursor: default; }
.marker.static:hover { border-color: var(--rule); }
.marker b { font-family: var(--display); font-size: var(--s3); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.marker span { color: var(--muted); font-size: var(--s-1); }

/* Tabs. */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; padding-block: 10px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 6px 14px 4px; font-family: var(--display); font-weight: 700; cursor: pointer; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab:hover:not([aria-selected="true"]) { border-color: var(--rule); color: var(--ink); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; font-size: var(--s-1); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Stops. */
.stop { width: 14px; height: 14px; flex: none; display: inline-block; }
.st-ready { background: var(--ok); border-radius: 50%; }
.st-blocked { background: var(--stop); border-radius: 2px; }
.st-waiting { border: 3px solid var(--wait); border-radius: 50%; background: var(--panel); }
.st-choice { background: var(--ask); transform: rotate(45deg) scale(0.85); border-radius: 2px; }

/* Routes. */
.routes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 16px; align-items: start; }
.route { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; min-width: 0; }
.route.primary { border: 2px solid var(--accent); }
.route header { padding: 14px 16px 12px; display: grid; gap: 6px; border-bottom: 1px solid var(--rule); }
.route .when { font-family: var(--mono); font-size: var(--s-1); color: var(--accent); }
.route .status { color: var(--muted); font-size: var(--s-1); }
.route .none { padding: 12px 16px 14px; color: var(--muted); font-size: var(--s-1); }
.line { list-style: none; margin: 0; padding: 12px 16px 14px; display: grid; gap: 0; }
.line li { position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding-block: 7px; }
.line li::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 3px; background: var(--rule); }
.line li:first-child::before { top: 14px; }
.line li:last-child::before { bottom: calc(100% - 14px); }
.line li .stop { position: relative; z-index: 1; margin-top: 3px; margin-left: 4px; }
button.go { text-align: left; background: none; border: 0; padding: 0; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
button.go:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.line .t { font-size: var(--s0); line-height: 1.35; overflow-wrap: anywhere; }
.who { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
/* Which file holds a stop, on the routes that cross both, and when it is picked up. */
.src { display: inline-block; font-family: var(--mono); font-size: 0.66rem; font-weight: 600; line-height: 1.35; padding: 0 5px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; color: var(--ink); }
.src-b { background: var(--chip); border: 1px solid var(--rule); }
.src-p { background: color-mix(in srgb, var(--accent) 24%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--panel)); }
.trig { font-size: var(--s-1); color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }

/* Cards and lists. */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 0.72rem; padding: 2px 8px 1px; border-radius: 999px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 18%, var(--panel)); }
.pill.stop { background: color-mix(in srgb, var(--stop) 18%, var(--panel)); }
.pill.wait { background: color-mix(in srgb, var(--wait) 22%, var(--panel)); }
.pill.ask { background: color-mix(in srgb, var(--ask) 18%, var(--panel)); }
.pill.accent { background: var(--accent); color: var(--accent-ink); }
.pill.done { background: color-mix(in srgb, var(--done) 30%, var(--panel)); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--bg); border-radius: 4px; padding: 3px 8px 2px; font-size: var(--s-1); cursor: pointer; text-align: left; max-width: 100%; overflow-wrap: anywhere; }
.chip:hover { border-color: var(--ink); }
.chip .cid { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); margin-right: 6px; }
span.chip { cursor: default; }
span.chip:hover { border-color: var(--rule); }
.chip.isdone { color: var(--muted); }
.chip.isdone::before { content: "\2713\00a0"; color: var(--ok); font-weight: 700; }
.chip.missing { color: var(--stop); border-style: dashed; }
/* Priority: ink for high, an outline for medium, a dashed outline for low; apart from the state colours of the stops. */
.prio { display: inline-block; font-family: var(--mono); font-size: 0.68rem; font-weight: 600; line-height: 1.35; padding: 0 5px; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; vertical-align: 1px; }
.prio.p-high { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.prio.p-medium { border-color: var(--muted); color: var(--ink); }
.prio.p-low { border-style: dashed; }
.chip .prio { margin-right: 6px; }
.who .prio { margin-right: 2px; }
.queue { display: grid; gap: 10px; }
.qrow { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: 2.2rem 1fr; gap: 10px; align-items: start; }
.qrow .n { font-family: var(--display); font-weight: 800; font-size: var(--s2); color: var(--accent); font-variant-numeric: tabular-nums; }
.qrow .body { display: grid; gap: 6px; min-width: 0; }
.qrow .go .t { font-weight: 700; font-size: var(--s0); overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ask); }

/* Checklists. */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 1.4rem 1fr; gap: 8px; align-items: start; }
.checks .txt { display: grid; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.box { width: 16px; height: 16px; border: 2px solid var(--muted); border-radius: 3px; margin-top: 3px; display: grid; place-items: center; font-size: 11px; line-height: 1; color: var(--panel); font-weight: 800; }
.box.on { background: var(--ok); border-color: var(--ok); }
.checks li.ticked .txt > p { color: var(--muted); }

/* Table. */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.filters input, .filters select { font: inherit; font-size: var(--s-1); padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 0; max-width: 100%; }
.filters input { flex: 1 1 220px; }
.filters select { flex: 0 1 auto; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: var(--s-1); }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--panel); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
td .t { font-weight: 600; }
td.wide { min-width: 16rem; }
.count { color: var(--muted); font-size: var(--s-1); margin-bottom: 8px; }

/* Detail drawer. */
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 21; border-left: 1px solid var(--rule); display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); }
.drawer header > div { min-width: 0; overflow-wrap: anywhere; }
.drawer .body { overflow-y: auto; padding: 16px 18px 28px; display: grid; gap: 14px; align-content: start; }
.drawer dl { display: grid; grid-template-columns: 8.5rem 1fr; gap: 6px 12px; margin: 0; }
.drawer dt { color: var(--muted); font-size: var(--s-1); }
.drawer dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.close { border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; padding: 4px 10px 2px; cursor: pointer; }
.section { display: grid; gap: 14px; }
.section + .section { margin-top: 28px; }
.intro { max-width: 72ch; color: var(--muted); }
ul.plain { margin: 0; padding-left: 1.1rem; display: grid; gap: 4px; }
.empty { padding: 18px; border: 1px dashed var(--rule); border-radius: 8px; color: var(--muted); }
@media (max-width: 640px) {
  h1 { font-size: var(--s3); }
  .drawer dl { grid-template-columns: 1fr; }
  .marker b { font-size: var(--s2); }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 160ms ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0.6; } }
}
</style>

window.DATA = /*DATA*/null;

<script>
(() => {
  const D = window.DATA;
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  };
  const DOT = ' \u00b7 ';

  const items = new Map(D.items.map((i) => [i.id, i]));
  const closedIds = new Set(D.doneIds);
  const MS = new Map(D.milestones.map((m) => [m.id, m]));
  const msLabel = (m) => MS.get(m)?.label || m;
  const msRank = (m) => { const k = D.milestones.findIndex((x) => x.id === m); return k < 0 ? D.milestones.length : k; };

  // Repository links, only when the generator was given a link base; otherwise paths are named, not linked.
  const repoPath = (from, target) => { const parts = from.split('/').slice(0, -1); for (const p of target.split('/')) { if (p === '..') parts.pop(); else if (p !== '.' && p !== '') parts.push(p); } return parts.join('/'); };
  const repoLink = (p, text) => D.linkBase ? h('a', { href: `${D.linkBase}/${p}`, target: '_blank', rel: 'noopener noreferrer' }, text) : h('code', {}, text);

  /** The backlog's inline Markdown as nodes: bold, emphasis, code, links and line breaks; never as HTML. */
  function md(text, from = 'docs/backlog.md') {
    const s = String(text ?? '');
    const out = [];
    const re = /\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|(<br\s*\/?>)|\*([^*\s][^*]*)\*/gi;
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) out.push(s.slice(last, m.index));
      if (m[1] !== undefined) out.push(h('strong', {}, m[1]));
      else if (m[2] !== undefined) out.push(h('code', {}, m[2]));
      else if (m[3] !== undefined) {
        const url = m[4];
        if (/^https?:\/\//i.test(url)) out.push(h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, m[3]));
        else if (D.linkBase && !/^[a-z][a-z0-9+.-]*:/i.test(url)) { const [file, anchor] = url.split('#'); out.push(h('a', { href: `${D.linkBase}/${file ? repoPath(from, file) : from}${anchor ? `#${anchor}` : ''}`, target: '_blank', rel: 'noopener noreferrer' }, m[3])); }
        else out.push(h('span', { title: url }, m[3]));
      } else if (m[5] !== undefined) out.push(h('br'));
      else out.push(h('em', {}, m[6]));
      last = re.lastIndex;
    }
    if (last < s.length) out.push(s.slice(last));
    return out;
  }
  const plain = (s) => String(s ?? '').replace(/\*\*|`/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/<br\s*\/?>/gi, ' ');

  const STATE = { ready: ['st-ready', 'Can land now'], choice: ['st-choice', 'Waits on a small choice of yours'], blocked: ['st-blocked', 'Waits on another open row'], waiting: ['st-waiting', 'Needs something not there today'] };
  const stateOf = (i) => i.landNow === 'yes' ? 'ready' : i.landNow === 'maybe' ? 'choice' : i.waitsOn.some((w) => items.has(w)) ? 'blocked' : 'waiting';
  const stop = (s) => h('i', { class: `stop ${STATE[s][0]}`, 'aria-hidden': 'true' });
  const LAND = { yes: ['ok', 'yes'], maybe: ['ask', 'small choice'], no: ['', 'no'] };
  const STATUS = { open: ['', 'open'], partly: ['wait', 'partly'] };
  const landPill = (i) => h('span', { class: `pill ${LAND[i.landNow][0]}` }, `Land now: ${LAND[i.landNow][1]}`);
  const statusPill = (i) => h('span', { class: `pill ${(STATUS[i.status] || STATUS.open)[0]}` }, i.status);
  // Values in the format's order (D.priorities, D.triggerTypes), any value outside it after them.
  const rankIn = (order, v) => { const k = order.indexOf(v); return k < 0 ? order.length : k; };
  const inOrder = (vals, order) => [...vals].sort((a, b) => rankIn(order, a) - rankIn(order, b) || (a < b ? -1 : a > b ? 1 : 0));
  const prioRank = (p) => rankIn(D.priorities, p);
  const prio = (i) => h('span', { class: `prio p-${D.priorities.includes(i.priority) ? i.priority : 'other'}`, title: `Priority: ${i.priority}` }, i.priority);

  /** A row's chip: opens the row; a closed row (named in the Done table) or an ID no row has is shown as such. */

      for (const g of D.launchList) wrap.append(h('div', { class: 'section' }, h('h3', {}, g.group || 'Launch checklist', ' ', h('span', { class: 'pill' }, `${g.lines.filter((l) => l.checked).length} of ${g.lines.length} ticked`)), checkList(g.lines)));
      return wrap;
    },
    review() {
      const wrap = h('div', { class: 'section' });
      wrap.append(h('p', { class: 'intro' }, `docs/backlog.md's Review checklist: every item of the external review of 2026-10-08 that its trace left open, each with the row that carries it, or ticked with where it closed. ${C.review.ticked} of its ${C.review.lines} lines are ticked. The review and its verification: `, repoLink(D.reviewDoc, D.reviewDoc), '.'));
      for (const g of D.review) wrap.append(h('div', { class: 'section' }, h('h3', {}, g.group || 'Review checklist', ' ', h('span', { class: 'pill' }, `${g.lines.filter((l) => l.checked).length} of ${g.lines.length} ticked`)), checkList(g.lines)));
      return wrap;
    },
    done() {
      const wrap = h('div', { class: 'section' });
      wrap.append(h('p', { class: 'intro' }, pane === 'backlog'
        ? `docs/backlog.md's table "Done since the route map of 2026-10-18": its ${C.closed} entries that close backlog rows, counted as closed in the numbers above. A row that closes leaves its table for this one.`
        : `The entries of docs/backlog.md's table "Done since the route map of 2026-10-18" that close playbook rows (their ID is a PB- one, or their row cell starts "The playbook row"): ${C.closed}, counted as closed in the numbers above. A playbook row that closes leaves its table for that one.`));
      if (!P.done.length) { wrap.append(h('p', { class: 'empty' }, PANES[pane].noDone)); return wrap; }
      wrap.append(h('div', { class: 'tablewrap' }, h('table', {}, h('thead', {}, h('tr', {}, D.done.headers.map((c) => h('th', { scope: 'col' }, c)))), h('tbody', {}, P.done.map((k) => D.done.entries[k]).map((e) => h('tr', {}, D.done.headers.map((_, k) => h('td', { class: k === 0 ? 'wide' : '' }, k === 0 ? h('div', { class: 't' }, md(e.cells[k] ?? '')) : md(e.cells[k] ?? '')))))))));
      return wrap;
    },
  };

  // The link's view, else the one last shown here, else the routes.
  const known = (t) => { const [k, id] = parse(t); return PANES[k].tabs.some(([x]) => x === id); };
  let start = (location.hash || '').slice(1);
  if (!known(start)) { try { start = localStorage.getItem('byway-routemap-tab') || ''; } catch { start = ''; } }
  if (!known(start)) start = 'routes';
  const [k0, id0] = parse(start);
  setPane(k0);
  show(id0);
})();
</script>
