# `pnpm verify` (the typecheck, the unit tests, then the end-to-end suite) on Windows and Linux (ADR-0103).
#
# It reports and blocks nothing: a red run puts a red mark on the commit and GitHub notifies the account that pushed it,
# and no push is refused. Read the latest result on main before merging: gh run list --branch main --limit 1
#
# It reads no repository secret. The tests use stand-in provider keys and fail if one leaks, so a run never reaches a
# paid provider.

name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly (Mondays 06:17 UTC): the tests download Chromium and the Temporal CLI, and pushes can stop for days. The
    # weekly run also says whether the Playwright pin has fallen behind npm's latest release and whether the providers'
    # pages still give byway's prices (two steps below).
    - cron: '17 6 * * 1'

permissions:
  contents: read

# A newer run on the same branch, of any trigger (a push, the weekly run or a run started by hand), cancels one still going.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # One entry per operating system; each step reads only its own entry. macOS is not run yet; to add it later:
        #   - { name: macos, os: macos-15, playwright: chromium }
        include:
          - { name: windows, os: windows-2025, playwright: chromium }
          - { name: linux, os: ubuntu-24.04, playwright: --with-deps chromium }
    steps:
      - name: Check out, with the whole history (the decision-log check reads main's)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node (the version in .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # The weekly run only, on one job: whether the pinned Playwright has fallen behind npm's latest release, for the
      # cadence the owner chose on 2026-10-21 (scripts/playwright-pin.ts says it). It reports in the log, in the run's
      # summary and, when the pin is behind, as a warning on the run's page. It fails nothing: the script exits 0 whatever
      # it finds, and the step may fail or time out without failing the job.
      - name: Is the Playwright pin behind npm's latest release? (the weekly run, Linux only; it reports and fails nothing)
        if: ${{ github.event_name == 'schedule' && matrix.name == 'linux' }}
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/playwright-pin.ts

      # The weekly run only, on one job: whether OpenRouter's model list and the other providers' pages still give the
      # prices byway records, for the cadence the owner chose on 2026-10-21 (scripts/price-report.ts says it). It reports
      # as the step above does, and when a figure is not found, or the monthly re-read is due, warns on the run's page;
      # Claude then reads the page again. It fails nothing, reads no secret, and needs only Node: prices.ts imports types.
      - name: Do the providers' pages still give byway's prices? (the weekly run, Linux only; it reports and fails nothing)
        if: ${{ github.event_name == 'schedule' && matrix.name == 'linux' }}
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/price-report.ts

      # pnpm/action-setup reads the version from package.json's packageManager, so no version is set here
      # (given a `version` input that differs from it, it stops with an error). It runs after setup-node, so it uses
      # the pinned Node.
      - name: pnpm (the version in package.json's packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright's Chromium (the renderer tests and the browser tests; with its system libraries on Linux)
        run: pnpm --filter ./apps/web exec playwright install ${{ matrix.playwright }}

      # Ubuntu restricts unprivileged user namespaces (by default from 24.04), which Chromium's OS sandbox needs, and byway
      # draws pages inside that sandbox (ADR-0105). This runs the script the README gives a Linux user, so every run tries
      # the README's steps: an AppArmor profile that lets Playwright's Chromium, in Playwright's own folder, create user
      # namespaces. As the README says, any program running as the user can then get them through that profile too.
      - name: Let Playwright's Chromium start its OS sandbox (the README's AppArmor script, Linux only)
        if: ${{ matrix.name == 'linux' }}
        run: sh scripts/linux/allow-chromium-sandbox.sh

      # Playwright's Linux dependencies make WenQuanYi Zen Hei the fallback font for Japanese, and with it Chromium lays
      # out the first item of a vertical row at no height, so a renderer test reads a page no person would see. Ubuntu's
      # desktop has Noto CJK instead, and with it (or IPAGothic) the same page lays out as on Windows.
      - name: Fonts as on Ubuntu's desktop (Linux only)
        if: ${{ matrix.name == 'linux' }}
        run: |
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk > /dev/null
          sudo apt-get remove --yes fonts-wqy-zenhei > /dev/null
          fc-match 'sans-serif:lang=ja'

      - name: The Temporal CLI (the engine tests start a local Temporal server; downloaded once into the temp folder)
        working-directory: packages/runner
        run: node --input-type=module -e "const { TestWorkflowEnvironment } = await import('@temporalio/testing'); const env = await TestWorkflowEnvironment.createLocal(); await env.teardown(); console.log('Temporal CLI ready');"

      - name: pnpm verify (the typecheck, the unit tests, then the end-to-end suite)
        run: pnpm verify

      # Only when a step failed: what the end-to-end suite leaves for a diagnosis, kept 14 days. The server's output
      # (byway's own, the renderer's included) goes to byway-e2e-server.log in the system temp folder (scripts/e2e.ts),
      # and Playwright keeps a trace and a screenshot of each failed browser test in apps/web/test-results. Each upload
      # is skipped when it finds no file: a job that fails before `pnpm e2e` starts uploads nothing, and one in which no
      # browser test failed uploads the log alone.
      - name: Where the end-to-end server log is (on failure)
        id: e2e-log
        if: ${{ failure() }}
        run: node -e "console.log('path=' + require('node:path').join(require('node:fs').realpathSync.native(require('node:os').tmpdir()), 'byway-e2e-server.log'))" >> "$GITHUB_OUTPUT"

      - name: Upload the end-to-end server log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-server-log-${{ matrix.name }}
          path: ${{ steps.e2e-log.outputs.path }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright's traces and screenshots (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.name }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
