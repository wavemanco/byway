# `pnpm verify` (the typecheck, the unit tests, then the end-to-end suite) on Windows and Linux (ADR-0103).
#
# It reports and blocks nothing: a red run puts a red mark on the commit and emails the repository's owner, and no
# push is refused. Read the latest result on main before merging: gh run list --branch main --limit 1
#
# No secrets. The tests use stand-in provider keys and fail if one leaks, so a run never reaches a paid provider.

name: verify

on:
  push:
    branches: [main, fix/fx-d4-ci]
  workflow_dispatch:
  schedule:
    # Weekly (Mondays 06:17 UTC): the tests download Chromium and the Temporal CLI, and pushes can stop for days.
    - cron: '17 6 * * 1'

permissions:
  contents: read

# A newer push cancels a run still going for an older commit on the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # One entry per operating system. macOS is not run yet; to add it later:
        #   - { name: macos, os: macos-15, playwright: chromium }
        include:
          - { name: windows, os: windows-2025, playwright: chromium }
          - { name: linux, os: ubuntu-24.04, playwright: --with-deps chromium }
    steps:
      - name: Check out, with the whole history (the decision-log check reads main's)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node (the version in .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Installed from npm, as on the owner's machine. pnpm's own installers (pnpm/action-setup, pnpm self-update)
      # refuse 11.12.0: npm marks it deprecated because its standalone build (@pnpm/exe) shipped without a binary.
      # The npm package itself runs.
      - name: pnpm (the version in package.json's packageManager)
        run: npm install --global "$(node -p "require('./package.json').packageManager")" && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright's Chromium (the renderer tests and the browser tests)
        run: pnpm --filter ./apps/web exec playwright install ${{ matrix.playwright }}

      - name: The Temporal CLI (the engine tests start a local Temporal server; downloaded once into the temp folder)
        working-directory: packages/runner
        run: node --input-type=module -e "const { TestWorkflowEnvironment } = await import('@temporalio/testing'); const env = await TestWorkflowEnvironment.createLocal(); await env.teardown(); console.log('Temporal CLI ready');"

      # Linux restricts unprivileged user namespaces (Ubuntu 23.10 and later), which Chromium's OS sandbox needs. One
      # renderer test starts Chromium inside its sandbox as a control, so Playwright's Chromium gets a profile that
      # allows them; the rest of the machine stays restricted.
      - name: Let Playwright's Chromium start its OS sandbox (an AppArmor profile, Linux only)
        if: ${{ matrix.name == 'linux' }}
        run: |
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' "profile playwright-chromium $HOME/.cache/ms-playwright/chromium*/chrome-*/chrome{,-headless-shell} flags=(unconfined) {" '  userns,' '}' | sudo tee /etc/apparmor.d/playwright-chromium
          sudo apparmor_parser --replace /etc/apparmor.d/playwright-chromium

      # Bring-up only (D2 needs it): can Chromium start inside its OS sandbox on this runner?
      - name: Chromium's OS sandbox on this runner (bring-up probe)
        if: ${{ matrix.name == 'linux' && !cancelled() }}
        working-directory: apps/web
        run: |
          uname -a; id -u
          for k in kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined kernel.unprivileged_userns_clone user.max_user_namespaces; do sysctl "$k" 2>&1 || true; done
          ls -d $HOME/.cache/ms-playwright/chromium*/chrome-*/chrome* || true
          probe() { node --input-type=module -e "const { chromium } = await import('@playwright/test'); for (const [label, opts] of [['headless shell', {}], ['full chromium', { channel: 'chromium' }]]) for (const sandbox of [false, true]) { const t = Date.now(); try { const b = await chromium.launch({ headless: true, chromiumSandbox: sandbox, ...opts }); const p = await b.newPage(); await p.setContent('<p>drawn</p>'); console.log(label + ', sandbox ' + sandbox + ': ' + (await p.textContent('p')) + ' in ' + (Date.now() - t) + ' ms'); await b.close(); } catch (e) { console.log(label + ', sandbox ' + sandbox + ': failed: ' + String(e.message).split(String.fromCharCode(10)).filter(Boolean).slice(0, 3).join(' | ')); } }"; }
          echo '--- with the AppArmor profile for the Playwright Chromium binaries'; probe
          echo '--- without it'; sudo apparmor_parser --remove /etc/apparmor.d/playwright-chromium && probe
          sudo apparmor_parser --replace /etc/apparmor.d/playwright-chromium

      # Bring-up only: the Japanese vertical page the voice test reads, as Chromium reads it here.
      - name: voice probe (bring-up)
        if: ${{ matrix.name == 'linux' && !cancelled() }}
        run: pnpm vitest run packages/runner/test/zz-linux-probe.test.ts --silent=false; fc-match 'sans-serif:lang=ja'; fc-match 'serif:lang=ja'; fc-match 'Times New Roman:lang=ja'; fc-list :lang=ja family | sort | head -20

      # Bring-up only: the three steps of pnpm verify, each run even when one before it fails.
      - name: typecheck
        if: ${{ !cancelled() }}
        run: pnpm -s typecheck
      - name: unit tests
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: end-to-end
        if: ${{ !cancelled() }}
        run: pnpm e2e
